<section class="bg-white py-8 md:py-12 px-4 md:px-6">
  <div class="max-w-6xl mx-auto">

    <!-- Search + Button -->
    <div class="flex flex-col md:flex-row gap-3">

      <div class="relative flex-1">
        <input
          type="text"
          placeholder="Search features..."
          class="w-full h-11 rounded-full border-2 border-gray-100 bg-white pl-12 pr-5 text-sm text-gray-700 outline-none focus:border-[#f85902] transition">

        <i data-lucide="search"
          class="w-4 h-4 text-gray-400 absolute left-5 top-1/2 -translate-y-1/2"></i>
      </div>

      <a href="#suggest-feature-modal"
        class="h-11 px-5 rounded-full bg-[#f85902] text-white font-semibold text-sm flex items-center justify-center gap-2 whitespace-nowrap">

        Suggest Feature
        <i data-lucide="arrow-up-right" class="w-4 h-4"></i>

      </a>

    </div>

    <!-- Status Tabs -->
    <div class="mt-5 overflow-x-auto">
      <div class="inline-flex p-1 rounded-full border-2 border-gray-100 bg-white min-w-max">

        <button class="px-5 py-2 rounded-full bg-[#f85902] text-white font-semibold text-sm">
          All
        </button>

        <button class="px-5 py-2 rounded-full text-gray-600 font-semibold text-sm">
          Shipped
        </button>

        <button class="px-5 py-2 rounded-full text-gray-600 font-semibold text-sm">
          In Progress
        </button>

        <button class="px-5 py-2 rounded-full text-gray-600 font-semibold text-sm">
          Planned
        </button>

        <button class="px-5 py-2 rounded-full text-gray-600 font-semibold text-sm">
          Considering
        </button>

      </div>
    </div>

    <!-- Roadmap Cards -->
    <div class="mt-8 grid gap-4">

      <!-- Card -->
      <div class="bg-white border-2 border-gray-100 rounded-[32px] p-5 md:p-6">

        <div class="flex flex-wrap gap-2 items-center">

          <span class="px-3 py-1 rounded-full bg-green-50 border border-green-100 text-green-700 font-semibold text-xs">
            Shipped
          </span>

          <span class="px-3 py-1 rounded-full bg-gray-50 border border-gray-100 text-gray-600 font-semibold text-xs">
            Add-ons
          </span>

          <span class="px-3 py-1 rounded-full bg-gray-50 border border-gray-100 text-gray-600 font-semibold text-xs">
            Q2 2026
          </span>

        </div>

        <div class="mt-4 flex items-center gap-3">

          <div class="w-12 h-12 rounded-2xl bg-gray-100 flex items-center justify-center">
            <i data-lucide="message-square" class="w-5 h-5"></i>
          </div>

          <div>
            <div class="text-xs text-gray-500 font-medium">
              284 votes
            </div>

            <h3 class="text-lg md:text-xl font-bold">
              Bulk SMS Add-on v2
            </h3>
          </div>

        </div>

        <p class="mt-4 text-sm md:text-base text-gray-500 leading-relaxed">
          Rewritten delivery engine with per-recipient status tracking,
          automatic retries, and telco failover.
        </p>

      </div>

    </div>

  </div>
</section>

<!-- FEATURE SUGGESTION MODAL -->
<div id="suggest-feature-modal"
  class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 opacity-0 pointer-events-none target:opacity-100 target:pointer-events-auto transition-all z-50">

  <div class="bg-white rounded-[32px] w-full max-w-xl p-6 md:p-8 relative">

    <a href="#"
      class="absolute top-5 right-5 w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center">

      <i data-lucide="x" class="w-4 h-4"></i>

    </a>

    <h3 class="text-2xl font-bold">
      Suggest a Feature
    </h3>

    <p class="mt-2 text-gray-500 text-sm">
      Highly-voted suggestions get prioritised.
    </p>

    <form class="mt-6 space-y-4">

      <div>
        <label class="block text-sm font-semibold mb-2">
          Feature Title
        </label>

        <input
          type="text"
          placeholder="e.g. Dark mode for the portal"
          class="w-full h-12 px-4 rounded-2xl border-2 border-gray-100 outline-none focus:border-[#f85902]">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-2">
          Category
        </label>

        <select
          class="w-full h-12 px-4 rounded-2xl border-2 border-gray-100 outline-none focus:border-[#f85902] bg-white">

          <option>API</option>
          <option>Dashboard</option>
          <option>Billing</option>
          <option>Add-ons</option>
          <option>Security</option>

        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-2">
          Description
        </label>

        <textarea
          rows="5"
          placeholder="What problem does this solve? Why is it important to your workflow?"
          class="w-full px-4 py-3 rounded-2xl border-2 border-gray-100 outline-none focus:border-[#f85902] resize-none"></textarea>
      </div>

      <div class="flex gap-3 pt-2">

        <a href="#"
          class="flex-1 h-12 rounded-full border-2 border-gray-100 font-semibold flex items-center justify-center">
          Cancel
        </a>

        <button
          type="submit"
          class="flex-1 h-12 rounded-full bg-[#f85902] text-white font-semibold flex items-center justify-center gap-2">

          Submit Idea
          <i data-lucide="arrow-up-right" class="w-4 h-4"></i>

        </button>

      </div>

    </form>

  </div>
</div>
