<!-- DASHBOARD HEADER --><header class="sticky top-0 z-50 bg-white border-b border-gray-100"><div class="max-w-7xl mx-auto px-4 py-2">

    <div class="flex items-center justify-between">

        <!-- LEFT -->
        <div class="flex items-center gap-3">

            <!-- Mobile Menu -->
            <button onclick="openMobileSidebar()"
                    class="md:hidden w-9 h-9 flex items-center justify-center text-gray-700">

                <i data-lucide="menu" class="w-5 h-5"></i>

            </button>

            <!-- Logo -->
            <a href="/dashboard" class="flex items-center">

                <img
                    src="/img/forma_orange_logo.webp"
                    alt="Logo"
                    class="h-7 md:h-8 w-auto object-contain">

            </a>

        </div>

        <!-- SEARCH -->
        <div class="hidden md:flex flex-1 max-w-lg mx-8">

            <div class="relative w-full">

                <input
                    type="text"
                    placeholder="Search..."
                    class="w-full h-10 rounded-full border border-gray-100 bg-white pl-10 pr-4 text-sm text-gray-700 outline-none focus:border-[#f85902] transition-all">

                <i data-lucide="search"
                   class="w-4 h-4 text-gray-400 absolute left-4 top-1/2 -translate-y-1/2"></i>

            </div>

        </div>

        <!-- RIGHT -->
        <div class="flex items-center gap-4">

            <!-- Support -->
            <a href="#"
               class="hidden md:block text-sm text-gray-700 hover:text-black">
                Support
            </a>

            <!-- Notifications -->
            <button
                class="relative w-9 h-9 flex items-center justify-center text-gray-700 hover:text-black">

                <i data-lucide="bell" class="w-5 h-5"></i>

                <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-[#f85902] rounded-full"></span>

            </button>

            <!-- Avatar -->
            <button
                class="w-9 h-9 rounded-full overflow-hidden">

                <img
                    src="https://i.pravatar.cc/150?img=12"
                    alt="Profile"
                    class="w-full h-full object-cover">

            </button>

        </div>

    </div>

</div>

</header><style>
input:focus{
    box-shadow: 0 0 0 3px rgba(248,89,2,.08);
}
</style><script>
document.addEventListener("DOMContentLoaded", () => {
    lucide.createIcons();
});
</script>
