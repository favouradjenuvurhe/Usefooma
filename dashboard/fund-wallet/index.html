<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fund Wallet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
#backdrop {
  display: none;
}
#backdrop.active {
  display: block;
}
</style>
</head>

<body class="bg-gray-50">

<!-- BACKDROP -->
<div id="backdrop"
     class="fixed inset-0 bg-black/40 z-40 md:hidden"
     onclick="closeMobileSidebar()"></div>

<!-- HEADER -->
<div id="header"></div>

<div class="flex">

  <!-- SIDEBAR -->
  <div id="sidebar" class="hidden md:block w-64"></div>

  <main class="flex-1 p-4 md:p-6">

    <!-- MAIN PAGE CONTENT -->
    <div id="account"></div>

  </main>

</div>

<!-- MOBILE SIDEBAR -->
<div id="mobile-sidebar"
     class="fixed top-0 left-0 h-full w-72 bg-white shadow-lg z-50 transform -translate-x-full transition-transform md:hidden">
</div>

<script type="module">

import { getMyDetails } from "/config/myDetails.js";

/* ================= AUTH ================= */
const uid = localStorage.getItem("uid");

if (!uid) {
  window.location.href = "/auth/login";
}

/* ================= SECTIONS ================= */
const SECTIONS = [
  { id: "header", file: "/dashboard/page/header.html" },
  { id: "sidebar", file: "/dashboard/page/sidebar.html" },
  { id: "mobile-sidebar", file: "/dashboard/page/mobile-sidebar.html" },

  /* MAIN CONTENT SECTION */
  { id: "account", file: "/dashboard/fund-wallet/account.html" }
];

/* ================= LOAD ================= */
async function loadSection(id, file) {

  try {
    const res = await fetch(file);
    document.getElementById(id).innerHTML = await res.text();
    lucide.createIcons();
  } catch (err) {
    console.error(err);
  }

}

async function loadAllSections() {
  for (const s of SECTIONS) {
    await loadSection(s.id, s.file);
  }
}

/* ================= SIDEBAR TOGGLE ================= */
window.openMobileSidebar = function () {

  document.getElementById("mobile-sidebar")
    .classList.remove("-translate-x-full");

  document.getElementById("backdrop")
    .classList.add("active");

};

window.closeMobileSidebar = function () {

  document.getElementById("mobile-sidebar")
    .classList.add("-translate-x-full");

  document.getElementById("backdrop")
    .classList.remove("active");

};

/* ================= ACCOUNT DATA ================= */
async function initAccount() {

  const data = await getMyDetails();

  if (!data.success) return;

  const box = document.getElementById("account");

  if (!box) return;

  box.innerHTML = `

    <!-- HEADER -->
    <div class="bg-white rounded-2xl border border-gray-100 p-4 mb-4">

      <h2 class="text-lg font-semibold text-gray-900">
        Fund Wallet
      </h2>

      <p class="text-xs text-gray-500 mt-1">
        Use the details below to fund your wallet
      </p>

    </div>

    <!-- ACCOUNT DETAILS -->
    <div class="bg-white rounded-2xl border border-gray-100 p-5 space-y-4">

      <!-- BANK NAME -->
      <div class="flex justify-between">
        <span class="text-sm text-gray-500">Bank Name</span>
        <span class="text-sm font-semibold text-gray-900">
          ${data.bankName || "Not Available"}
        </span>
      </div>

      <!-- ACCOUNT NAME -->
      <div class="flex justify-between">
        <span class="text-sm text-gray-500">Account Name</span>
        <span class="text-sm font-semibold text-gray-900">
          ${data.accountName || "Not Available"}
        </span>
      </div>

      <!-- ACCOUNT NUMBER -->
      <div class="flex justify-between">
        <span class="text-sm text-gray-500">Account Number</span>
        <span class="text-sm font-semibold text-gray-900">
          ${data.accountNumber || "Not Available"}
        </span>
      </div>

    </div>

    <!-- NOTE -->
    <div class="mt-4 text-xs text-gray-500">
      Send money only to the account details above.
    </div>

  `;

}

/* ================= INIT ================= */
await loadAllSections();
await initAccount();

</script>

</body>
  </html>
