<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<title>Customers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><style>
#backdrop{
display:none;
}
#backdrop.active{
display:block;
}
</style></head><body class="bg-gray-50"><!-- BACKDROP --><div id="backdrop"
class="fixed inset-0 bg-black/40 z-40 md:hidden"
onclick="closeMobileSidebar()"></div><!-- HEADER --><div id="header"></div><div class="flex"><!-- SIDEBAR --><div id="sidebar" class="hidden md:block w-64"></div><main class="flex-1 p-4 md:p-6"><div id="customers"></div></main></div><!-- MOBILE SIDEBAR --><div id="mobile-sidebar"
class="fixed top-0 left-0 h-full w-72 bg-white shadow-lg z-50 transform -translate-x-full transition-transform md:hidden">
</div><script type="module">

import { getCustomers } from "/config/Customers.js";

/* ================= AUTH ================= */

const uid = localStorage.getItem("uid");

if (!uid) {
window.location.href = "/auth/login";
}

/* ================= SECTIONS ================= */

const SECTIONS = [

{
id: "header",
file: "/dashboard/page/header.html"
},

{
id: "sidebar",
file: "/dashboard/page/sidebar.html"
},

{
id: "mobile-sidebar",
file: "/dashboard/page/mobile-sidebar.html"
},

{
id: "customers",
file: ""
}

];

/* ================= LOAD SECTION ================= */

async function loadSection(id,file){

try{

if(!file) return;

const res = await fetch(file);

document.getElementById(id).innerHTML =
await res.text();

lucide.createIcons();

}catch(err){

console.error(err);

}

}

async function loadAllSections(){

for(const s of SECTIONS){

await loadSection(
s.id,
s.file
);

}

}

/* ================= SIDEBAR ================= */

window.openMobileSidebar = function(){

document
.getElementById("mobile-sidebar")
.classList.remove("-translate-x-full");

document
.getElementById("backdrop")
.classList.add("active");

};

window.closeMobileSidebar = function(){

document
.getElementById("mobile-sidebar")
.classList.add("-translate-x-full");

document
.getElementById("backdrop")
.classList.remove("active");

};

/* ================= CUSTOMERS ================= */

async function initCustomers(){

const data = await getCustomers();

if(!data.success){
return;
}

const box =
document.getElementById("customers");

box.innerHTML = `

<div class="bg-white rounded-2xl border border-gray-100 p-4 mb-4">

<h2 class="text-lg font-semibold text-gray-900">
Customers
</h2>

<p class="text-xs text-gray-500 mt-1">
All customers from subscribed domains
</p>

</div>

<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">

<div class="bg-white p-3 rounded-xl border">
<p class="text-xs text-gray-500">
Users
</p>

<h3 class="font-semibold">
${data.usersCount}
</h3>
</div>

<div class="bg-green-50 p-3 rounded-xl border border-green-100">
<p class="text-xs text-green-600">
Wallet Balance
</p>

<h3 class="font-semibold text-green-700">
₦${Number(data.totalWalletBalance).toLocaleString()}
</h3>
</div>

<div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
<p class="text-xs text-blue-600">
Dollar Balance
</p>

<h3 class="font-semibold text-blue-700">
$${Number(data.totalDollarBalance).toLocaleString()}
</h3>
</div>

<div class="bg-orange-50 p-3 rounded-xl border border-orange-100">
<p class="text-xs text-orange-600">
Domains
</p>

<h3 class="font-semibold text-orange-700">
${data.totalDomains}
</h3>
</div>

</div>

<div class="space-y-3">

${data.users.map(user => `

<div class="bg-white border rounded-xl p-4">

<div class="flex justify-between gap-4">

<div>

<p class="font-semibold text-gray-900">
${user.fullname || "No Name"}
</p>

<p class="text-xs text-gray-500">
${user.email || ""}
</p>

<p class="text-xs text-gray-500 mt-1">
${user.phone || ""}
</p>

</div>

<div class="text-right">

<p class="font-semibold text-green-600">
₦${Number(user.wallet || 0).toLocaleString()}
</p>

<p class="text-xs text-blue-600">
$${Number(user.dollar || 0).toLocaleString()}
</p>

</div>

</div>

<div class="mt-3 pt-3 border-t">

<p class="text-xs text-gray-500 break-all">
${user.domain}
</p>
</div>

</div>

`).join("")}

</div>

`;

}

/* ================= INIT ================= */

await loadAllSections();
await initCustomers();

</script></body>
</html>
