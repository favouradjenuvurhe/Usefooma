<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Website Mockup Generator</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="icon" href="/img/favicon.png">
</head>

<body class="bg-white">

<div id="header"></div>

<div class="sticky top-0 z-50 bg-white border-b">
  <div id="navbar"></div>
</div>

<div id="hero"></div>
<div id="services"></div>
<div id="how"></div>
<div id="cta"></div>
<div id="footer"></div>

<script>
const sections = [
  { id: 'header', file: 'page/header.html' },
  { id: 'navbar', file: 'page/navbar.html' },
  { id: 'hero', file: 'page/hero.html' },
  { id: 'services', file: 'page/services.html' },
  { id: 'how', file: 'page/how.html' },
  { id: 'cta', file: 'page/cta.html' },
  { id: 'footer', file: 'page/footer.html' },
];

sections.forEach(section => {
  fetch(section.file)
    .then(res => res.text())
    .then(data => {
      document.getElementById(section.id).innerHTML = data;
    });
});
</script>

</body>
</html>
