<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Mockup Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen p-6">

<div class="max-w-2xl mx-auto mt-10">
  
  <h1 class="text-4xl font-bold mb-3">Live Website Mockup</h1>
  <p class="text-slate-400 mb-8">
    Enter website URL and choose a phone device.
  </p>

  <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5">

    <div>
      <label class="block mb-2 text-sm text-slate-400">Website URL</label>
      <input
        id="url"
        type="text"
        placeholder="https://example.com"
        class="w-full h-12 px-4 rounded-xl bg-slate-800 border border-slate-700 outline-none"
      >
    </div>

    <div>
      <label class="block mb-2 text-sm text-slate-400">Select Device</label>
      <select
        id="device"
        class="w-full h-12 px-4 rounded-xl bg-slate-800 border border-slate-700 outline-none"
      >
        <option value="iphone-17">iPhone 17</option>
        <option value="iphone-16">iPhone 16</option>
        <option value="samsung-s24">Samsung S24 Ultra</option>
      </select>
    </div>

    <button
      onclick="goPreview()"
      class="w-full h-12 rounded-xl bg-blue-600 hover:bg-blue-700 font-semibold"
    >
      Generate Mockup
    </button>

  </div>

</div>

<script>
function goPreview(){
  let url = document.getElementById("url").value.trim();
  let device = document.getElementById("device").value;

  if(!url){
    alert("Enter website URL");
    return;
  }

  if(!url.startsWith("http://") && !url.startsWith("https://")){
    url = "https://" + url;
  }

  window.location.href =
    "view/" + device + ".html?url=" + encodeURIComponent(url);
}
</script>

</body>
</html>
