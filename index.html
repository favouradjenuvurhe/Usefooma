<div id="services"></div>
<div id="how"></div>
<div id="cta"></div>
<div id="footer"></div>

<script>
const sections = [
  { id: 'header', file: 'page/header.html' },
  { id: 'navbar', file: 'page/navbar.html' },
  { id: 'hero', file: 'page/hero.html' },
  { id: 'services', file: 'page/services.html' },
  { id: 'how', file: 'page/how.html' },
  { id: 'cta', file: 'page/cta.html' },
  { id: 'footer', file: 'page/footer.html' },
];

sections.forEach(section => {
  fetch(section.file)
    .then(res => res.text())
    .then(data => {
      document.getElementById(section.id).innerHTML = data;

      // re-init icons after load
      if (window.lucide) lucide.createIcons();
    });
});

// ✅ GLOBAL FUNCTION (NOW WORKS)
function goPreview(){
  let url = document.getElementById("url").value.trim();
  let device = document.getElementById("device").value;

  if(!url){
    alert("Enter website URL");
    return;
  }

  if(!url.startsWith("http://") && !url.startsWith("https://")){
    url = "https://" + url;
  }

  window.location.href =
    "view/" + device + ".html?url=" + encodeURIComponent(url);
}
</script>
