<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>iPhone 17 Mockup</title>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body {
  background: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
}

/* ✅ OUTER WRAPPER (ONLY THIS IS SCALED) */
.phone-wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.38);
  transform-origin: center;

  /* FIXES BEND / DISTORTION */
  will-change: transform;
  backface-visibility: hidden;
  transform-style: flat;
}

/* ✅ PHONE (NO SCALE, NO TRANSFORM = PERFECT STRAIGHT) */
.phone {
  width: 260px;
  height: 560px;
  border-radius: 42px;

  /* FIX: cleaner lighting (removes "bend illusion") */
  background: linear-gradient(180deg, #fdfdfd, #dcdcdc);

  box-shadow:
    0 25px 50px rgba(0,0,0,0.25),
    inset 0 0 0 1px #e5e5e5;

  position: relative;
}

/* SCREEN */
.screen {
  position: absolute;
  inset: 5px;
  border-radius: 36px;
  overflow: hidden;
  background: black;
}

/* GLASS */
.screen::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, rgba(255,255,255,0.25), transparent 40%);
  z-index: 2;
}

/* DYNAMIC ISLAND */
.dynamic-island {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 90px;
  height: 24px;
  background: #000;
  border-radius: 30px;
  z-index: 5;
}

/* SIDE BUTTONS */
.side-buttons::before,
.side-buttons::after {
  content: "";
  position: absolute;
  left: -2px;
  width: 3px;
  background: #bbb;
  border-radius: 3px;
}

.side-buttons::before { top: 120px; height: 50px; }
.side-buttons::after { top: 180px; height: 35px; }

/* BOTTOM PORT */
.bottom-port {
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
  height: 5px;
  background: #aaa;
  border-radius: 5px;
}

/* SHADOW */
.phone-shadow {
  position: absolute;
  width: 220px;
  height: 50px;
  background: rgba(0,0,0,0.25);
  filter: blur(30px);
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 50%;
}
</style>
</head>

<body>

<div id="header"></div>
<div id="navbar"></div>

<div id="app" class="max-w-md mx-auto py-6 px-4">

  <div class="bg-white rounded-3xl p-3 shadow-sm border border-gray-200">

    <!-- CAPTURE AREA -->
    <div id="captureArea"
      class="relative rounded-2xl overflow-hidden bg-gray-100 w-full aspect-[1260/1000]">

      <div class="relative w-full h-full">

        <div class="phone-shadow"></div>

        <!-- ✅ FIXED: WRAPPER HANDLES SCALE ONLY -->
        <div class="phone-wrap">

          <div class="phone side-buttons">

            <div class="screen">
              <div class="dynamic-island"></div>

              <div class="w-full h-full relative">

                <!-- USER IMAGE -->
                <img v-if="image" :src="image" class="w-full h-full object-cover"/>

                <!-- DEFAULT DESIGN -->
                <template v-else>
                  <div class="w-full h-full flex flex-col">

                    <div class="flex-1 flex">
                      <div class="w-1/2 bg-[#ff7a45] flex items-center justify-center">
                        <span class="text-4xl font-black rotate-90 tracking-widest">Usefooma</span>
                      </div>
                      <div class="w-1/2 bg-[#0f766e]"></div>
                    </div>

                    <div class="h-[35%] flex">
                      <div class="w-1/3 bg-[#111827]"></div>
                      <div class="w-1/3 bg-[#f1f5f9]"></div>
                      <div class="w-1/3 bg-[#14b8a6]"></div>
                    </div>

                  </div>
                </template>

              </div>
            </div>

            <div class="bottom-port"></div>

          </div>
        </div>

      </div>
    </div>

    <!-- TITLE -->
    <div class="flex justify-between items-center mt-4 px-1">
      <h2 class="text-[18px] font-semibold text-gray-800">iPhone 17 Pro</h2>
      <span class="text-gray-400 text-sm">1260 × 1000 px</span>
    </div>

    <!-- UPLOAD -->
    <button @click="triggerUpload"
      class="w-full mt-4 bg-black text-white rounded-2xl py-4 flex items-center justify-center gap-2 text-[15px] font-medium">
      <i data-lucide="upload" class="w-5 h-5"></i>
      Upload Image
    </button>

    <input type="file" ref="fileInput" accept="image/*" class="hidden" @change="handleUpload">

  </div>

  <!-- EXPORT -->
  <div class="mt-6">
    <h3 class="text-gray-400 text-sm font-semibold mb-3">Design Scene</h3>

    <div @click="downloadPNG"
      class="bg-white rounded-2xl p-4 flex items-center gap-3 border cursor-pointer mb-3">
      <i data-lucide="download" class="w-5 h-5"></i>
      <span>Download PNG</span>
    </div>

    <div @click="downloadJPG"
      class="bg-white rounded-2xl p-4 flex items-center gap-3 border cursor-pointer">
      <i data-lucide="image" class="w-5 h-5"></i>
      <span>Download JPG</span>
    </div>
  </div>

</div>

<div id="footer"></div>

<script>
const sections = [
  { id: 'header', file: '/page/header.html' },
  { id: 'navbar', file: '/page/navbar.html' },
  { id: 'footer', file: '/page/footer.html' },
];

sections.forEach(section => {
  fetch(section.file)
    .then(res => res.text())
    .then(data => {
      document.getElementById(section.id).innerHTML = data;
      lucide.createIcons();
    });
});

const { createApp } = Vue;

createApp({
  data(){
    return { image: null }
  },
  methods:{
    triggerUpload(){
      this.$refs.fileInput.click();
    },
    handleUpload(e){
      const file = e.target.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = (e)=>{
        this.image = e.target.result;
      };
      reader.readAsDataURL(file);
    },
    downloadPNG(){
      this.exportImage("png");
    },
    downloadJPG(){
      this.exportImage("jpeg");
    },
    exportImage(type){
      const el = document.getElementById("captureArea");

      html2canvas(el,{
        backgroundColor:null,
        scale:6
      }).then(canvas=>{
        const link = document.createElement("a");
        link.download = `iphone17-usefooma-mockup.${type}`;
        link.href = type === "png"
          ? canvas.toDataURL("image/png")
          : canvas.toDataURL("image/jpeg",0.95);
        link.click();
      });
    }
  },
  mounted(){
    lucide.createIcons();
  }
}).mount('#app');
</script>

</body>
  </html>
