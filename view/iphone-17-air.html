<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>iPhone 17 Air Zoom Mockup</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#ffffff;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
touch-action:none;
}

.stage{
width:100%;
height:100vh;
position:relative;
overflow:hidden;
background:#ffffff;
}

.device-wrap{
position:absolute;
left:50%;
top:50%;
cursor:grab;
user-select:none;
touch-action:none;
transform-origin:center center;
}
.device-wrap:active{cursor:grabbing;}

.shadow-air{
position:absolute;
left:50%;
top:50%;
width:300px;
height:120px;
border-radius:50%;
background:rgba(0,0,0,.13);
filter:blur(30px);
transform:translate(-50%,-50%);
z-index:0;
}

/* PHONE */
.phone{
position:relative;
width:315px;
height:682px;
border-radius:44px;
background:linear-gradient(145deg,#fafafa,#d8d8d8);
border:1.5px solid #111;
overflow:hidden;
box-shadow:
0 24px 50px rgba(0,0,0,.16),
inset 2px 0 rgba(255,255,255,.7),
inset -2px 0 rgba(0,0,0,.12);
z-index:2;
}

.phone:before{
content:"";
position:absolute;
inset:0;
border-radius:44px;
box-shadow:
inset 1px 1px rgba(255,255,255,.8),
inset -1px -1px rgba(0,0,0,.14);
pointer-events:none;
z-index:30;
}

/* SCREEN */
.screen{
position:absolute;
top:5px;
left:5px;
right:5px;
bottom:5px;
border-radius:39px;
overflow:hidden;
background:#fff;
}

.screen iframe{
position:absolute;
inset:0;
width:100%;
height:100%;
border:none;
display:block;
background:#fff;
z-index:1;
}

/* STATUS BAR */
.status-bar{
position:absolute;
top:0;
left:0;
right:0;
height:42px;
padding:0 14px;
display:flex;
align-items:center;
justify-content:space-between;
font-size:13px;
font-weight:600;
color:#000;
z-index:50;
pointer-events:none;
}

.status-left{
min-width:54px;
}

.status-right{
display:flex;
align-items:center;
gap:6px;
}

/* signal */
.signal{
display:flex;
align-items:flex-end;
gap:2px;
height:12px;
}
.signal span{
width:3px;
background:#000;
border-radius:2px;
display:block;
}
.signal span:nth-child(1){height:4px;}
.signal span:nth-child(2){height:6px;}
.signal span:nth-child(3){height:8px;}
.signal span:nth-child(4){height:10px;}

/* wifi */
.wifi{
font-size:12px;
line-height:1;
}

/* battery */
.battery{
width:24px;
height:12px;
border:1.8px solid #000;
border-radius:4px;
position:relative;
}
.battery:before{
content:"";
position:absolute;
top:2px;
right:-4px;
width:2px;
height:6px;
background:#000;
border-radius:0 2px 2px 0;
}
.battery-level{
position:absolute;
top:1px;
left:1px;
height:8px;
width:16px;
background:#000;
border-radius:2px;
}

/* dynamic island */
.island{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
width:88px;
height:25px;
background:#000;
border-radius:999px;
z-index:60;
pointer-events:none;
}

/* buttons */
.btn{
position:absolute;
left:-2px;
width:3px;
background:#8f8f8f;
border-radius:4px;
z-index:30;
}
.b1{top:145px;height:34px;}
.b2{top:205px;height:58px;}
.b3{top:278px;height:58px;}

/* bottom */
.port{
position:absolute;
bottom:9px;
left:50%;
transform:translateX(-50%);
width:32px;
height:4px;
background:#666;
border-radius:999px;
z-index:30;
}

.grill{
position:absolute;
bottom:9px;
display:flex;
gap:4px;
z-index:30;
}
.gl{left:74px;}
.gr{right:74px;}

.grill span{
width:3px;
height:3px;
background:#666;
border-radius:50%;
}

/* zoom */
.zoom-handle{
position:absolute;
right:-28px;
top:50%;
transform:translateY(-50%);
width:22px;
height:22px;
border-radius:50%;
background:#111;
border:2px solid #fff;
box-shadow:0 0 10px rgba(0,0,0,.2);
cursor:nwse-resize;
z-index:80;
}

/* mobile */
@media(max-width:768px){
.phone{
width:255px;
height:552px;
border-radius:38px;
}
.screen{
top:4px;
left:4px;
right:4px;
bottom:4px;
border-radius:34px;
}
.status-bar{
height:38px;
font-size:11px;
padding:0 10px;
}
.island{
width:74px;
height:22px;
top:9px;
}
.shadow-air{
width:250px;
height:100px;
}
.zoom-handle{
right:-24px;
width:20px;
height:20px;
}
}
</style>
</head>
<body>

<div id="app">

<div class="stage"
@mousemove="move"
@mouseup="stopAction"
@mouseleave="stopAction"
@touchmove.prevent="touchMove"
@touchend="stopAction">

<div class="device-wrap"
:style="wrapperStyle"
@mousedown="startDrag($event)"
@touchstart.prevent="touchStart($event)">

<div class="shadow-air" :style="shadowStyle"></div>

<div class="phone">

<div class="zoom-handle"
@mousedown.stop="startZoom($event)"
@touchstart.stop.prevent="touchZoomStart($event)"></div>

<div class="btn b1"></div>
<div class="btn b2"></div>
<div class="btn b3"></div>

<div class="screen">

<div class="status-bar">
<div class="status-left" id="timeText">9:41</div>

<div class="status-right">
<div class="signal">
<span></span><span></span><span></span><span></span>
</div>
<div class="wifi">◖◗</div>
<div class="battery"><div class="battery-level"></div></div>
</div>
</div>

<div class="island"></div>

<iframe id="frame"></iframe>

</div>

<div class="grill gl"><span></span><span></span><span></span></div>
<div class="port"></div>
<div class="grill gr"><span></span><span></span><span></span></div>

</div>
</div>

</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

document.addEventListener("DOMContentLoaded",()=>{
document.getElementById("frame").src =
params.get("url") || "https://example.com";

updateTime();
setInterval(updateTime,1000);
});

function updateTime(){
const now = new Date();
let h = now.getHours();
let m = now.getMinutes().toString().padStart(2,'0');
h = h % 12 || 12;
document.getElementById("timeText").textContent = h + ":" + m;
}

const {createApp}=Vue;

createApp({
data(){
return{
x:window.innerWidth/2,
y:window.innerHeight/2,
scale:1,
dragging:false,
zooming:false,
offsetX:0,
offsetY:0,
startY:0,
startScale:1
}
},
computed:{
wrapperStyle(){
return{
left:this.x+'px',
top:this.y+'px',
transform:`translate(-50%,-50%) scale(${this.scale})`
}
},
shadowStyle(){
return{
transform:`translate(-50%,-50%) scale(${this.scale})`
}
}
},
methods:{
startDrag(e){
if(this.zooming)return;
this.dragging=true;
this.offsetX=e.clientX-this.x;
this.offsetY=e.clientY-this.y;
},
startZoom(e){
this.zooming=true;
this.startY=e.clientY;
this.startScale=this.scale;
},
move(e){
if(this.dragging){
this.x=e.clientX-this.offsetX;
this.y=e.clientY-this.offsetY;
}
if(this.zooming){
let diff=(this.startY-e.clientY)/320;
this.scale=Math.max(.55,Math.min(2.3,this.startScale+diff));
}
},
touchStart(e){
if(this.zooming)return;
const t=e.touches[0];
this.dragging=true;
this.offsetX=t.clientX-this.x;
this.offsetY=t.clientY-this.y;
},
touchZoomStart(e){
const t=e.touches[0];
this.zooming=true;
this.startY=t.clientY;
this.startScale=this.scale;
},
touchMove(e){
const t=e.touches[0];

if(this.dragging){
this.x=t.clientX-this.offsetX;
this.y=t.clientY-this.offsetY;
}
if(this.zooming){
let diff=(this.startY-t.clientY)/320;
this.scale=Math.max(.55,Math.min(2.3,this.startScale+diff));
}
},
stopAction(){
this.dragging=false;
this.zooming=false;
}
}
}).mount('#app');
</script>

</body>
</html>
