<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>iPhone 17 Air Mockup CLEAN</title>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
background:#f5f5f5;
}

/* STAGE */
.stage{
width:100%;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

/* DEVICE WRAP */
.device-wrap{
position:absolute;
left:50%;
top:50%;
transform-origin:center center;
cursor:grab;
user-select:none;
touch-action:none;
}
.device-wrap:active{cursor:grabbing;}

/* SHADOW */
.shadow-air{
position:absolute;
left:50%;
top:50%;
width:320px;
height:140px;
border-radius:50%;
background:rgba(0,0,0,.12);
filter:blur(30px);
transform:translate(-50%,-50%);
}

/* PHONE */
.phone{
width:360px;
height:780px;
border-radius:44px;
background:linear-gradient(145deg,#f8f8f8,#d9d9d9);
border:1.5px solid #111;
overflow:hidden;
display:flex;
position:relative;
}

/* SCREEN FULL HEIGHT */
.screen{
width:100%;
height:100%;
display:flex;
overflow:hidden;
position:relative;
}

/* WEBVIEW FULL 100% */
.webview{
width:100%;
height:100%;
overflow:hidden;
}

.webview iframe{
width:100%;
height:100%;
border:none;
display:block;
background:#fff;
}

/* ZOOM HANDLE */
.zoom-handle{
position:absolute;
right:-28px;
top:50%;
transform:translateY(-50%);
width:22px;
height:22px;
border-radius:50%;
background:#111;
border:2px solid #fff;
cursor:nwse-resize;
z-index:50;
}

/* MOBILE */
@media(max-width:768px){
.phone{
width:290px;
height:620px;
}
}
</style>
</head>

<body>

<div id="app">

<div class="stage"
@mousemove="move"
@mouseup="stopAction"
@mouseleave="stopAction"
@touchmove="touchMove"
@touchend="stopAction">

<div class="device-wrap"
:style="wrapperStyle"
@mousedown="startDrag($event)"
@touchstart="touchStart($event)">

<div class="shadow-air"></div>

<div class="phone">

<div class="zoom-handle"
@mousedown.stop="startZoom($event)"
@touchstart.stop="touchZoomStart($event)"></div>

<div class="screen">
<div class="webview">
<iframe id="frame"></iframe>
</div>
</div>

</div>
</div>

</div>

</div>

<script>
const params = new URLSearchParams(location.search);

const {createApp}=Vue;

createApp({
data(){
return{
x:innerWidth/2,
y:innerHeight/2,
scale:1,
dragging:false,
zooming:false,
offsetX:0,
offsetY:0,
startY:0,
startScale:1
}
},

computed:{
wrapperStyle(){
return{
left:this.x+"px",
top:this.y+"px",
transform:`translate(-50%,-50%) scale(${this.scale})`
}
}
},

mounted(){
document.getElementById("frame").src =
params.get("url") || "https://example.com";
},

methods:{

startDrag(e){
if(this.zooming)return;
this.dragging=true;
this.offsetX=e.clientX-this.x;
this.offsetY=e.clientY-this.y;
},

startZoom(e){
this.zooming=true;
this.startY=e.clientY;
this.startScale=this.scale;
},

move(e){
if(this.dragging){
this.x=e.clientX-this.offsetX;
this.y=e.clientY-this.offsetY;
}
if(this.zooming){
let diff=(this.startY-e.clientY)/300;
this.scale=Math.max(.5,Math.min(2,this.startScale+diff));
}
},

touchStart(e){
const t=e.touches[0];
this.dragging=true;
this.offsetX=t.clientX-this.x;
this.offsetY=t.clientY-this.y;
},

touchZoomStart(e){
const t=e.touches[0];
this.zooming=true;
this.startY=t.clientY;
this.startScale=this.scale;
},

touchMove(e){
const t=e.touches[0];

if(this.dragging){
this.x=t.clientX-this.offsetX;
this.y=t.clientY-this.offsetY;
}

if(this.zooming){
let diff=(this.startY-t.clientY)/300;
this.scale=Math.max(.5,Math.min(2,this.startScale+diff));
}
},

stopAction(){
this.dragging=false;
this.zooming=false;
}

}

}).mount("#app");
</script>

</body>
</html>
