<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>iPhone 17 Air Mockup (Fixed)</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#ffffff;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
touch-action:none;
}

/* STAGE */
.stage{
width:100%;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#ffffff;
position:relative;
}

/* WRAP */
.device-wrap{
position:absolute;
left:50%;
top:50%;
transform-origin:center center;
cursor:grab;
user-select:none;
touch-action:none;
}
.device-wrap:active{cursor:grabbing;}

/* SHADOW */
.shadow-air{
position:absolute;
left:50%;
top:50%;
width:320px;
height:140px;
border-radius:50%;
background:rgba(0,0,0,.12);
filter:blur(30px);
transform:translate(-50%,-50%);
z-index:0;
}

/* DEVICE BODY (6.5 inch feel) */
.phone{
width:360px;
height:780px;
border-radius:44px;
background:linear-gradient(145deg,#f8f8f8,#d9d9d9);
border:1.5px solid #111;
overflow:hidden;
box-shadow:0 30px 60px rgba(0,0,0,.18);
position:relative;
z-index:2;
display:flex;
flex-direction:column;
}

/* INNER BORDER */
.phone::before{
content:"";
position:absolute;
inset:0;
border-radius:44px;
box-shadow:inset 1px 1px rgba(255,255,255,.7),
inset -1px -1px rgba(0,0,0,.12);
pointer-events:none;
z-index:10;
}

/* SCREEN (FIXED — NO OVERFLOW BUG) */
.screen{
flex:1;
display:flex;
flex-direction:column;
background:#fff;
overflow:hidden;
}

/* STATUS BAR (USES PAGE COLOR) */
.status-bar{
height:44px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
font-size:13px;
font-weight:600;
color:#000;
background:transparent; /* IMPORTANT */
z-index:20;
}

/* RIGHT ICONS */
.status-right{
display:flex;
align-items:center;
gap:6px;
}

/* SIGNAL */
.signal{
display:flex;
align-items:flex-end;
gap:2px;
height:12px;
}
.signal span{
width:3px;
background:#000;
border-radius:2px;
}
.signal span:nth-child(1){height:4px;}
.signal span:nth-child(2){height:6px;}
.signal span:nth-child(3){height:8px;}
.signal span:nth-child(4){height:10px;}

/* WIFI */
.wifi{font-size:12px}

/* BATTERY */
.battery{
width:24px;
height:12px;
border:1.6px solid #000;
border-radius:4px;
position:relative;
}
.battery:before{
content:"";
position:absolute;
right:-4px;
top:3px;
width:2px;
height:5px;
background:#000;
}
.battery-level{
position:absolute;
left:1px;
top:1px;
width:16px;
height:8px;
background:#000;
border-radius:2px;
}

/* ISLAND */
.island{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
width:90px;
height:26px;
background:#000;
border-radius:999px;
z-index:30;
}

/* WEBVIEW (FIXED HEIGHT PROBLEM) */
.webview{
flex:1;
min-height:0;
overflow:hidden;
}

.webview iframe{
width:100%;
height:100%;
border:none;
display:block;
background:#fff;
}

/* SIDE BUTTONS (optional realism) */
.btn{
position:absolute;
left:-2px;
width:3px;
background:#888;
border-radius:4px;
z-index:30;
}
.b1{top:150px;height:36px;}
.b2{top:210px;height:60px;}
.b3{top:290px;height:60px;}

/* zoom */
.zoom-handle{
position:absolute;
right:-28px;
top:50%;
transform:translateY(-50%);
width:22px;
height:22px;
border-radius:50%;
background:#111;
border:2px solid #fff;
z-index:50;
cursor:nwse-resize;
}

/* MOBILE */
@media(max-width:768px){
.phone{
width:290px;
height:620px;
}
}
</style>
</head>

<body>

<div id="app">

<div class="stage"
@mousemove="move"
@mouseup="stopAction"
@mouseleave="stopAction"
@touchmove.prevent="touchMove"
@touchend="stopAction">

<div class="device-wrap"
:style="wrapperStyle"
@mousedown="startDrag($event)"
@touchstart.prevent="touchStart($event)">

<div class="shadow-air"></div>

<div class="phone">

<div class="zoom-handle"
@mousedown.stop="startZoom($event)"
@touchstart.stop.prevent="touchZoomStart($event)"></div>

<div class="btn b1"></div>
<div class="btn b2"></div>
<div class="btn b3"></div>

<div class="screen">

<!-- STATUS BAR -->
<div class="status-bar">
<div id="timeText">9:41</div>

<div class="status-right">
<div class="signal">
<span></span><span></span><span></span><span></span>
</div>
<div class="wifi">◖◗</div>
<div class="battery"><div class="battery-level"></div></div>
</div>
</div>

<!-- ISLAND -->
<div class="island"></div>

<!-- WEB -->
<div class="webview">
<iframe id="frame"></iframe>
</div>

</div>
</div>

</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

document.addEventListener("DOMContentLoaded",()=>{
document.getElementById("frame").src =
params.get("url") || "https://example.com";

setInterval(()=>{
const d=new Date();
let h=d.getHours()%12||12;
let m=String(d.getMinutes()).padStart(2,"0");
document.getElementById("timeText").textContent=`${h}:${m}`;
},1000);
});

const {createApp}=Vue;

createApp({
data(){
return{
x:innerWidth/2,
y:innerHeight/2,
scale:1,
dragging:false,
zooming:false,
offsetX:0,
offsetY:0,
startY:0,
startScale:1
}
},
computed:{
wrapperStyle(){
return{
left:this.x+"px",
top:this.y+"px",
transform:`translate(-50%,-50%) scale(${this.scale})`
}
}
},
methods:{
startDrag(e){
if(this.zooming)return;
this.dragging=true;
this.offsetX=e.clientX-this.x;
this.offsetY=e.clientY-this.y;
},
startZoom(e){
this.zooming=true;
this.startY=e.clientY;
this.startScale=this.scale;
},
move(e){
if(this.dragging){
this.x=e.clientX-this.offsetX;
this.y=e.clientY-this.offsetY;
}
if(this.zooming){
let diff=(this.startY-e.clientY)/320;
this.scale=Math.max(.5,Math.min(2,this.startScale+diff));
}
},
touchStart(e){
const t=e.touches[0];
this.dragging=true;
this.offsetX=t.clientX-this.x;
this.offsetY=t.clientY-this.y;
},
touchZoomStart(e){
const t=e.touches[0];
this.zooming=true;
this.startY=t.clientY;
this.startScale=this.scale;
},
touchMove(e){
const t=e.touches[0];

if(this.dragging){
this.x=t.clientX-this.offsetX;
this.y=t.clientY-this.offsetY;
}
if(this.zooming){
let diff=(this.startY-t.clientY)/320;
this.scale=Math.max(.5,Math.min(2,this.startScale+diff));
}
},
stopAction(){
this.dragging=false;
this.zooming=false;
}
}
}).mount("#app");
</script>

</body>
</html>
