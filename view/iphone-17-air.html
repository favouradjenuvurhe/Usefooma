<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>iPhone 17 Air Mockup FIXED</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

/* STAGE (FIX SCROLL BLOCK ISSUE) */
.stage{
width:100%;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
}

/* DEVICE WRAP */
.device-wrap{
position:absolute;
left:50%;
top:50%;
transform-origin:center center;
cursor:grab;
user-select:none;
}
.device-wrap:active{cursor:grabbing;}

/* SHADOW */
.shadow-air{
position:absolute;
left:50%;
top:50%;
width:320px;
height:140px;
border-radius:50%;
background:rgba(0,0,0,.12);
filter:blur(30px);
transform:translate(-50%,-50%);
}

/* PHONE */
.phone{
width:360px;
height:780px;
border-radius:44px;
background:linear-gradient(145deg,#f8f8f8,#d9d9d9);
border:1.5px solid #111;
overflow:hidden;
display:flex;
flex-direction:column;
position:relative;
}

/* SCREEN */
.screen{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* STATUS BAR (DYNAMIC COLOR) */
.status-bar{
height:44px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 14px;
font-size:13px;
font-weight:600;
transition:.3s;
}

/* DARK MODE SUPPORT */
.dark .status-bar{
color:#fff;
}
.dark .signal span,
.dark .battery,
.dark .battery-level{
background:#fff;
border-color:#fff;
}

/* ICONS */
.status-right{
display:flex;
gap:6px;
align-items:center;
}

.signal{
display:flex;
gap:2px;
align-items:flex-end;
height:12px;
}
.signal span{
width:3px;
background:#000;
border-radius:2px;
}
.signal span:nth-child(1){height:4px;}
.signal span:nth-child(2){height:6px;}
.signal span:nth-child(3){height:8px;}
.signal span:nth-child(4){height:10px;}

.wifi{font-size:12px;}

.battery{
width:24px;
height:12px;
border:1.6px solid #000;
border-radius:4px;
position:relative;
}
.battery:before{
content:"";
position:absolute;
right:-4px;
top:3px;
width:2px;
height:5px;
background:#000;
}
.battery-level{
position:absolute;
left:1px;
top:1px;
width:16px;
height:8px;
background:#000;
}

/* ISLAND */
.island{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
width:90px;
height:26px;
background:#000;
border-radius:999px;
}

/* IFRAME (FIXED SCROLLING) */
.webview{
flex:1;
overflow:auto;
-webkit-overflow-scrolling:touch;
}

.webview iframe{
width:100%;
height:100%;
border:none;
display:block;
}

/* BUTTONS */
.zoom-handle{
position:absolute;
right:-28px;
top:50%;
transform:translateY(-50%);
width:22px;
height:22px;
background:#111;
border:2px solid #fff;
border-radius:50%;
cursor:nwse-resize;
}
</style>
</head>

<body>

<div id="app">

<div class="stage"
:class="{dark:isDark}"
@mousemove="move"
@mouseup="stopAction"
@mouseleave="stopAction"
@touchmove.prevent="touchMove"
@touchend="stopAction">

<div class="device-wrap"
:style="wrapperStyle"
@mousedown="startDrag($event)"
@touchstart.prevent="touchStart($event)">

<div class="shadow-air"></div>

<div class="phone">

<div class="zoom-handle"
@mousedown.stop="startZoom($event)"
@touchstart.stop.prevent="touchZoomStart($event)"></div>

<div class="screen">

<div class="status-bar">
<div>{{time}}</div>

<div class="status-right">
<div class="signal">
<span></span><span></span><span></span><span></span>
</div>
<div class="wifi">◖◗</div>
<div class="battery"><div class="battery-level"></div></div>
</div>
</div>

<div class="island"></div>

<div class="webview">
<iframe id="frame"></iframe>
</div>

</div>

</div>
</div>

</div>

<script>
const params = new URLSearchParams(location.search);

const {createApp} = Vue;

createApp({
data(){
return{
x:innerWidth/2,
y:innerHeight/2,
scale:1,
dragging:false,
zooming:false,
offsetX:0,
offsetY:0,
startY:0,
startScale:1,
time:"9:41",
isDark:false
}
},

computed:{
wrapperStyle(){
return{
left:this.x+"px",
top:this.y+"px",
transform:`translate(-50%,-50%) scale(${this.scale})`
}
}
},

mounted(){
document.getElementById("frame").src =
params.get("url") || "https://example.com";

setInterval(()=>{
let d=new Date();
let h=d.getHours()%12||12;
let m=String(d.getMinutes()).padStart(2,"0");
this.time=`${h}:${m}`;
},1000);

/* SIMPLE DARK DETECTION */
this.detectTheme();
},

methods:{

detectTheme(){
try{
const bg = getComputedStyle(document.body).backgroundColor;
this.isDark = bg.includes("0,0,0") || bg.includes("rgb(0");
}catch(e){}
},

startDrag(e){
if(this.zooming)return;
this.dragging=true;
this.offsetX=e.clientX-this.x;
this.offsetY=e.clientY-this.y;
},

startZoom(e){
this.zooming=true;
this.startY=e.clientY;
this.startScale=this.scale;
},

move(e){
if(this.dragging){
this.x=e.clientX-this.offsetX;
this.y=e.clientY-this.offsetY;
}
if(this.zooming){
let diff=(this.startY-e.clientY)/300;
this.scale=Math.max(.5,Math.min(2,this.startScale+diff));
}
},

touchStart(e){
const t=e.touches[0];
this.dragging=true;
this.offsetX=t.clientX-this.x;
this.offsetY=t.clientY-this.y;
},

touchZoomStart(e){
const t=e.touches[0];
this.zooming=true;
this.startY=t.clientY;
this.startScale=this.scale;
},

touchMove(e){
const t=e.touches[0];

if(this.dragging){
this.x=t.clientX-this.offsetX;
this.y=t.clientY-this.offsetY;
}

if(this.zooming){
let diff=(this.startY-t.clientY)/300;
this.scale=Math.max(.5,Math.min(2,this.startScale+diff));
}
},

stopAction(){
this.dragging=false;
this.zooming=false;
}
}

}).mount("#app");
</script>

</body>
</html>
