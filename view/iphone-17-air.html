<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>iPhone 17 Air Zoom Mockup</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#ffffff;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
touch-action:none;
}

.stage{
width:100%;
height:100vh;
position:relative;
overflow:hidden;
background:#ffffff;
}

/* draggable area */
.device-wrap{
position:absolute;
left:50%;
top:50%;
cursor:grab;
user-select:none;
touch-action:none;
transform-origin:center center;
}

.device-wrap:active{
cursor:grabbing;
}

/* shadow */
.shadow-air{
position:absolute;
left:50%;
top:50%;
width:340px;
height:170px;
border-radius:50%;
background:rgba(0,0,0,.14);
filter:blur(35px);
transform:translate(-50%,-50%);
z-index:0;
}

/* phone */
.phone{
position:relative;
width:390px;
height:820px;
background:linear-gradient(145deg,#f8f8f8,#d8d8d8);
border:2px solid #111;
border-radius:46px;
padding:12px;
box-shadow:
0 30px 60px rgba(0,0,0,.18),
inset 1px 0 rgba(255,255,255,.8),
inset -1px 0 rgba(0,0,0,.15);
z-index:2;
}

/* inner gloss */
.phone:before{
content:"";
position:absolute;
inset:0;
border-radius:46px;
box-shadow:
inset 2px 0 rgba(255,255,255,.6),
inset -2px 0 rgba(0,0,0,.12);
pointer-events:none;
z-index:10;
}

/* screen FIXED */
.screen{
position:relative;
width:100%;
height:100%;
border-radius:34px;
overflow:hidden;
background:#fff;
}

/* iframe FIXED */
.screen iframe{
width:100%;
height:100%;
border:none;
display:block;
background:#fff;
}

/* notch */
.island{
position:absolute;
top:0;
left:50%;
transform:translateX(-50%);
width:140px;
height:28px;
background:#000;
border-radius:0 0 18px 18px;
z-index:20;
pointer-events:none;
}

/* buttons */
.btn{
position:absolute;
left:-2px;
width:3px;
background:#999;
border-radius:4px;
z-index:30;
}
.b1{top:160px;height:40px;}
.b2{top:230px;height:70px;}
.b3{top:320px;height:70px;}

/* bottom */
.port{
position:absolute;
bottom:10px;
left:50%;
transform:translateX(-50%);
width:34px;
height:5px;
background:#666;
border-radius:999px;
z-index:30;
}

.grill{
position:absolute;
bottom:10px;
display:flex;
gap:4px;
z-index:30;
}
.gl{left:88px;}
.gr{right:88px;}
.grill span{
width:3px;
height:3px;
background:#666;
border-radius:50%;
}

/* zoom handle */
.zoom-handle{
position:absolute;
right:-32px;
top:50%;
transform:translateY(-50%);
width:22px;
height:22px;
border-radius:50%;
background:#111;
border:2px solid #fff;
box-shadow:0 0 12px rgba(0,0,0,.25);
cursor:nwse-resize;
z-index:50;
}

/* mobile */
@media(max-width:768px){
.phone{
width:320px;
height:680px;
border-radius:40px;
padding:10px;
}
.screen{border-radius:28px;}
.island{
width:110px;
height:24px;
}
.shadow-air{
width:280px;
height:140px;
}
.zoom-handle{
right:-26px;
width:20px;
height:20px;
}
}
</style>
</head>
<body>

<div id="app">

<div class="stage"
@mousemove="move"
@mouseup="stopAction"
@mouseleave="stopAction"
@touchmove.prevent="touchMove"
@touchend="stopAction">

<div class="device-wrap"
:style="wrapperStyle"
@mousedown="startDrag($event)"
@touchstart.prevent="touchStart($event)">

<div class="shadow-air" :style="shadowStyle"></div>

<div class="phone">

<div class="zoom-handle"
@mousedown.stop="startZoom($event)"
@touchstart.stop.prevent="touchZoomStart($event)"></div>

<div class="btn b1"></div>
<div class="btn b2"></div>
<div class="btn b3"></div>

<div class="screen">
<div class="island"></div>
<iframe id="frame"></iframe>
</div>

<div class="grill gl"><span></span><span></span><span></span></div>
<div class="port"></div>
<div class="grill gr"><span></span><span></span><span></span></div>

</div>
</div>

</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

document.addEventListener("DOMContentLoaded",()=>{
document.getElementById("frame").src =
params.get("url") || "https://example.com";
});

const {createApp}=Vue;

createApp({
data(){
return{
x:window.innerWidth/2,
y:window.innerHeight/2,
scale:.78,
dragging:false,
zooming:false,
offsetX:0,
offsetY:0,
startY:0,
startScale:1
}
},
computed:{
wrapperStyle(){
return{
left:this.x+'px',
top:this.y+'px',
transform:`translate(-50%,-50%) scale(${this.scale})`
}
},
shadowStyle(){
return{
transform:`translate(-50%,-50%) scale(${this.scale})`
}
}
},
methods:{
startDrag(e){
if(this.zooming)return;
this.dragging=true;
this.offsetX=e.clientX-this.x;
this.offsetY=e.clientY-this.y;
},
startZoom(e){
this.zooming=true;
this.startY=e.clientY;
this.startScale=this.scale;
},
move(e){
if(this.dragging){
this.x=e.clientX-this.offsetX;
this.y=e.clientY-this.offsetY;
}
if(this.zooming){
let diff=(this.startY-e.clientY)/350;
this.scale=Math.max(.45,Math.min(2.2,this.startScale+diff));
}
},
touchStart(e){
if(this.zooming)return;
const t=e.touches[0];
this.dragging=true;
this.offsetX=t.clientX-this.x;
this.offsetY=t.clientY-this.y;
},
touchZoomStart(e){
const t=e.touches[0];
this.zooming=true;
this.startY=t.clientY;
this.startScale=this.scale;
},
touchMove(e){
const t=e.touches[0];

if(this.dragging){
this.x=t.clientX-this.offsetX;
this.y=t.clientY-this.offsetY;
}

if(this.zooming){
let diff=(this.startY-t.clientY)/350;
this.scale=Math.max(.45,Math.min(2.2,this.startScale+diff));
}
},
stopAction(){
this.dragging=false;
this.zooming=false;
}
}
}).mount('#app');
</script>

</body>
</html>
