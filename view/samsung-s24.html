<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samsung S24 Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#020617;}
.phone{
width:400px;height:860px;background:#0f0f0f;
border:8px solid #000;border-radius:38px;
padding:10px;
position:relative;
}
.camera{
width:18px;height:18px;background:#000;
border-radius:999px;
position:absolute;top:10px;left:50%;
transform:translateX(-50%);
z-index:10;
}
.screen{
width:100%;height:100%;
border-radius:28px;overflow:hidden;background:#fff;
}
iframe{width:100%;height:100%;border:none;}
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

<div class="phone">
<div class="camera"></div>
<div class="screen">
<iframe id="frame"></iframe>
</div>
</div>

<script>
const params = new URLSearchParams(location.search);
document.getElementById("frame").src =
params.get("url") || "https://example.com";
</script>

</body>
</html>
