<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tablet Mockup</title>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body {
  background: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* Scene */
.scene {
  background: linear-gradient(145deg, #e5e7eb, #d1d5db);
}

/* Tablet */
.tablet {
  width: 280px;
  height: 180px;
  border-radius: 20px;
  background: #111;
  box-shadow:
    0 20px 40px rgba(0,0,0,0.25),
    0 5px 12px rgba(0,0,0,0.15);

  transform: none;
  position: relative;
}

/* Screen */
.screen {
  position: absolute;
  inset: 6px;
  border-radius: 14px;
  overflow: hidden;
  background: #000;
}

/* Reflection */
.screen::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.08));
}

/* Shadow */
.shadow-floor {
  position: absolute;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  height: 25px;
  background: rgba(0,0,0,0.25);
  border-radius: 50%;
  filter: blur(15px);
}
</style>
</head>

<body>

<!-- ✅ DYNAMIC HEADER -->
<div id="header"></div>

<!-- ✅ DYNAMIC NAVBAR -->
<div id="navbar"></div>

<div id="app" class="max-w-md mx-auto py-6 px-4">

<div class="bg-white rounded-3xl p-3 shadow-sm border border-gray-200">

<!-- CAPTURE AREA -->
<div id="captureArea"
class="relative rounded-2xl overflow-hidden w-full aspect-[1260/1000] scene flex items-center justify-center">

<!-- Shadow -->
<div class="shadow-floor"></div>

<!-- Tablet -->
<div class="relative flex items-center justify-center">
  <div class="tablet">

    <div class="screen">
      <div class="w-full h-full flex flex-col">

        <!-- Uploaded Image -->
        <img v-if="image" :src="image" class="w-full h-full object-cover"/>

        <!-- Default UI -->
        <template v-else>
          <div class="flex-1 flex">
            <div class="w-1/4 bg-[#9db4ff]"></div>
            <div class="w-1/4 bg-[#0f7c8a]"></div>
            <div class="w-1/4 bg-[#e5e7eb]"></div>
            <div class="w-1/4 bg-[#ff7a45]"></div>
          </div>

          <div class="h-[30%] flex">
            <div class="w-1/4 bg-[#9db4ff]"></div>
            <div class="w-1/4 bg-[#2dd4bf]"></div>
            <div class="w-1/4 bg-[#fcd5ce]"></div>
            <div class="w-1/4 bg-[#a3e635]"></div>
          </div>

          <div class="absolute top-3 left-4 text-black text-2xl font-bold">
            Mockups
          </div>
        </template>

      </div>
    </div>
  </div>
</div>

</div>

<!-- TITLE -->
<div class="flex justify-between items-center mt-4 px-1">
  <h2 class="text-[18px] font-semibold text-gray-800">Tablet Mockup</h2>
  <span class="text-gray-400 text-sm">1260 × 1000 px</span>
</div>

<!-- UPLOAD -->
<button @click="triggerUpload"
class="w-full mt-4 bg-black text-white rounded-2xl py-4 flex items-center justify-center gap-2 text-[15px] font-medium">
<i data-lucide="upload" class="w-5 h-5"></i>
Upload Image
</button>

<input type="file" ref="fileInput" accept="image/*" class="hidden" @change="handleUpload">

</div>

<!-- EXPORT -->
<div class="mt-6">

<h3 class="text-gray-400 text-sm tracking-wide font-semibold mb-3">
Design Scene
</h3>

<div @click="downloadPNG"
class="bg-white rounded-2xl p-4 flex items-center gap-3 border border-gray-200 mb-3 cursor-pointer active:scale-[0.98]">
<i data-lucide="download" class="w-5 h-5 text-gray-600"></i>
<span class="text-gray-700 text-[15px]">Download PNG</span>
</div>

<div @click="downloadJPG"
class="bg-white rounded-2xl p-4 flex items-center gap-3 border border-gray-200 cursor-pointer active:scale-[0.98]">
<i data-lucide="image" class="w-5 h-5 text-gray-600"></i>
<span class="text-gray-700 text-[15px]">Download JPG</span>
</div>

</div>

</div>

<!-- ✅ DYNAMIC FOOTER -->
<div id="footer"></div>

<script>
// ✅ LOAD HEADER / NAVBAR / FOOTER
const sections = [
  { id: 'header', file: '/page/header.html' },
  { id: 'navbar', file: '/page/navbar.html' },
  { id: 'footer', file: '/page/footer.html' },
];

sections.forEach(section => {
  fetch(section.file)
    .then(res => res.text())
    .then(data => {
      document.getElementById(section.id).innerHTML = data;
      lucide.createIcons();
    })
    .catch(err => console.error(`Error loading ${section.file}`, err));
});

const { createApp } = Vue;

createApp({
data(){
return{
image:null
}
},
methods:{
triggerUpload(){
this.$refs.fileInput.click();
},
handleUpload(e){
const file = e.target.files[0];
if(!file) return;

const reader = new FileReader();
reader.onload = (e)=>{
this.image = e.target.result;
};
reader.readAsDataURL(file);
},
downloadPNG(){
this.exportImage("png");
},
downloadJPG(){
this.exportImage("jpeg");
},
exportImage(type){
const el = document.getElementById("captureArea");

html2canvas(el,{
backgroundColor:null,
scale:5
}).then(canvas=>{
const link = document.createElement("a");
link.download = `mockup.${type}`;
link.href = type === "png"
? canvas.toDataURL("image/png")
: canvas.toDataURL("image/jpeg",0.95);
link.click();
});
}
},
mounted(){
lucide.createIcons();
}
}).mount('#app');
</script>

</body>
</html>
