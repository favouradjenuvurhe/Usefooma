<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Iphone Air - Mockup</title>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body {
  background: #f3f4f6;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.phone {
  width: 240px;
  height: 520px;
  border-radius: 32px;
  background: linear-gradient(160deg, #f8f8f8, #d9d9d9);
  box-shadow:
    0 20px 40px rgba(0,0,0,0.18),
    inset 0 0 0 1px #e5e5e5;
  position: relative;

  transform: rotate(-24deg) rotateX(10deg) scale(0.35) translateY(20px);
}

.screen {
  position: absolute;
  inset: 4px;
  border-radius: 28px;
  overflow: hidden;
  background: black;
}

.screen::after {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 30px rgba(255,255,255,0.08);
}

.dynamic-island {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 20px;
  background: #000;
  border-radius: 20px;
  z-index: 20;
}

.side-buttons::before,
.side-buttons::after {
  content: "";
  position: absolute;
  left: -2px;
  width: 2px;
  background: #cfcfcf;
  border-radius: 2px;
}

.side-buttons::before {
  top: 100px;
  height: 40px;
}

.side-buttons::after {
  top: 150px;
  height: 25px;
}

.bottom-port {
  position: absolute;
  bottom: 3px;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 4px;
  background: #aaa;
  border-radius: 3px;
}
</style>
</head>

<body>

<!-- ✅ DYNAMIC HEADER -->
<div id="header"></div>

<!-- ✅ DYNAMIC NAVBAR -->
<div id="navbar"></div>

<div id="app" class="max-w-md mx-auto py-6 px-4">

<div class="bg-white rounded-3xl p-3 shadow-sm border border-gray-200">

<div id="captureArea"
class="relative rounded-2xl overflow-hidden bg-gray-200 w-full aspect-[1260/1000] flex items-center justify-center">

<div class="relative flex items-center justify-center w-full h-full">

<div class="absolute w-32 h-12 bg-black/10 blur-2xl rounded-full bottom-10 left-1/2 -translate-x-1/2"></div>

<div class="phone side-buttons">

<div class="screen">

<div class="dynamic-island"></div>

<div class="w-full h-full flex flex-col">

<img v-if="image" :src="image" class="w-full h-full object-cover"/>

<template v-else>
<div class="flex-1 flex">
<div class="w-2/3 bg-white flex items-center justify-center">
<span class="text-3xl font-bold rotate-90">Usefooma</span>
</div>
<div class="w-1/3 bg-[#4e6ed6]"></div>
</div>

<div class="h-[30%] flex">
<div class="w-1/3 bg-orange-400"></div>
<div class="w-1/3 bg-lime-400"></div>
<div class="w-1/3 bg-pink-300"></div>
</div>
</template>

</div>
</div>

<div class="bottom-port"></div>

</div>
</div>
</div>

<div class="flex justify-between items-center mt-4 px-1">
<h2 class="text-[18px] font-semibold text-gray-800">iPhone Air</h2>
<span class="text-gray-400 text-sm">1260 × 1000 px</span>
</div>

<button @click="triggerUpload"
class="w-full mt-4 bg-black text-white rounded-2xl py-4 flex items-center justify-center gap-2 text-[15px] font-medium">
<i data-lucide="upload" class="w-5 h-5"></i>
Upload Image
</button>

<input type="file" ref="fileInput" accept="image/*" class="hidden" @change="handleUpload">

</div>

<div class="mt-6">

<h3 class="text-gray-400 text-sm tracking-wide font-semibold mb-3">
Design Scene
</h3>

<div @click="downloadPNG"
class="bg-white rounded-2xl p-4 flex items-center gap-3 border border-gray-200 mb-3 cursor-pointer active:scale-[0.98]">
<i data-lucide="download" class="w-5 h-5 text-gray-600"></i>
<span class="text-gray-700 text-[15px]">Download PNG</span>
</div>

<div @click="downloadJPG"
class="bg-white rounded-2xl p-4 flex items-center gap-3 border border-gray-200 cursor-pointer active:scale-[0.98]">
<i data-lucide="image" class="w-5 h-5 text-gray-600"></i>
<span class="text-gray-700 text-[15px]">Download JPG</span>
</div>

</div>
</div>

<!-- ✅ DYNAMIC FOOTER -->
<div id="footer"></div>

<script>
// ✅ LOAD SECTIONS
const sections = [
  { id: 'header', file: '/page/header.html' },
  { id: 'navbar', file: '/page/navbar.html' },
  { id: 'footer', file: '/page/footer.html' },
];

sections.forEach(section => {
  fetch(section.file)
    .then(res => res.text())
    .then(data => {
      document.getElementById(section.id).innerHTML = data;

      // ✅ Re-render icons inside loaded HTML
      lucide.createIcons();
    })
    .catch(err => console.error(`Error loading ${section.file}`, err));
});

const { createApp } = Vue;

createApp({
data(){
return{ image:null }
},
methods:{
triggerUpload(){
this.$refs.fileInput.click();
},
handleUpload(e){
const file = e.target.files[0];
if(!file) return;

const reader = new FileReader();
reader.onload = (e)=>{
this.image = e.target.result;
};
reader.readAsDataURL(file);
},
downloadPNG(){
this.exportImage("png");
},
downloadJPG(){
this.exportImage("jpeg");
},
exportImage(type){
const el = document.getElementById("captureArea");

html2canvas(el,{
backgroundColor:null,
scale:4
}).then(canvas=>{
const link = document.createElement("a");
link.download = `mockup.${type}`;
link.href = type === "png"
? canvas.toDataURL("image/png")
: canvas.toDataURL("image/jpeg",0.95);
link.click();
});
}
},
mounted(){
lucide.createIcons();
}
}).mount('#app');
</script>

</body>
</html>
