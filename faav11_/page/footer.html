<!-- FOOTER / CONTACT SECTION -->
<footer class="mt-20 border-t border-gray-100 px-6 py-16 bg-white">

  <div class="max-w-5xl mx-auto">

    <!-- TITLE -->
    <h2 class="text-2xl font-semibold text-black">Get in touch</h2>

    <p class="mt-4 text-gray-600 text-sm leading-relaxed max-w-2xl">
      I'm always interested in exploring new opportunities, collaborating, or exchanging ideas with like-minded individuals.
      Feel free to book a call or email me if you'd like to see my portfolio deck or to discuss a potential project.
    </p>

    <!-- FORM -->
    <form class="mt-10 grid grid-cols-1 gap-6 max-w-2xl">

      <!-- FULL NAME -->
      <input
        type="text"
        placeholder="Full Name"
        class="w-full px-4 py-3 border border-gray-200 rounded-md focus:outline-none focus:border-black"
      />

      <!-- EMAIL -->
      <input
        type="email"
        placeholder="Email Address"
        class="w-full px-4 py-3 border border-gray-200 rounded-md focus:outline-none focus:border-black"
      />

      <!-- MESSAGE -->
      <textarea
        rows="5"
        placeholder="Write your Message"
        class="w-full px-4 py-3 border border-gray-200 rounded-md focus:outline-none focus:border-black"
      ></textarea>

      <!-- BUTTON -->
      <button
        type="submit"
        class="w-full md:w-fit px-6 py-3 bg-black text-white rounded-md hover:opacity-90 transition"
      >
        Send Message
      </button>

    </form>

    <!-- LOGO + COPYRIGHT (optional keep) -->
    <div class="mt-16">

      <div class="flex items-center">
        
      </div>

      <p class="mt-4 text-sm text-gray-400">
        © 2026 All Rights Reserved
      </p>

    </div>

  </div>

</footer>
