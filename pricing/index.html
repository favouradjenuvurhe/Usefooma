<!-- LOAD SECTIONS -->
<script>
const sections = [
  { id: 'header', file: '/page/header.html' },
  { id: 'navbar', file: 'page/navbar.html' },
  { id: 'hero', file: 'pricing/page/hero.html' },
  { id: 'section', file: 'pricing/page/section.html' },
];

/* ================= PRICING TABS ================= */
function showPricing(tab) {

  const sectionsList = ['monthly', 'quarterly', 'yearly'];

  const buttons = {
    monthly: document.getElementById('tabMonthly'),
    quarterly: document.getElementById('tabQuarterly'),
    yearly: document.getElementById('tabYearly')
  };

  // hide all pricing sections
  sectionsList.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.add('hidden');
  });

  // show selected
  const activeSection = document.getElementById(tab);
  if (activeSection) activeSection.classList.remove('hidden');

  // reset all buttons
  Object.keys(buttons).forEach(key => {
    const btn = buttons[key];
    if (btn) {
      btn.className =
        "flex-1 md:w-40 flex items-center justify-center px-4 md:px-6 py-2 rounded-full text-gray-700 font-semibold text-sm md:text-base whitespace-nowrap";
    }
  });

  // activate current button
  if (buttons[tab]) {
    buttons[tab].className =
      "flex-1 md:w-40 flex items-center justify-center px-4 md:px-6 py-2 rounded-full bg-[#f85902] text-white font-semibold text-sm md:text-base whitespace-nowrap";
  }
}


/* ================= PAGE LOADER ================= */
sections.forEach(section => {

  fetch(section.file)
    .then(res => res.text())
    .then(html => {

      const target = document.getElementById(section.id);
      if (target) target.innerHTML = html;

      // re-init icons after load
      if (window.lucide) lucide.createIcons();

      /* MOBILE MENU FIX */
      if (section.id === "navbar") {

        setTimeout(() => {

          const mobileMenu = document.getElementById("mobileMenu");
          const openMenu = document.getElementById("openMenu");
          const closeMenu = document.getElementById("closeMenu");

          if (openMenu && mobileMenu) {
            openMenu.addEventListener("click", () => {
              mobileMenu.classList.add("active");
              document.body.style.overflow = "hidden";
            });
          }

          if (closeMenu && mobileMenu) {
            closeMenu.addEventListener("click", () => {
              mobileMenu.classList.remove("active");
              document.body.style.overflow = "";
            });
          }

        }, 100);
      }

    })
    .catch(err => console.log(err));

});
</script>
