<!-- HERO -->
<main class="text-center px-6 pt-16">

  <h1 class="text-4xl md:text-6xl font-extrabold leading-tight text-black">
    404 - Page Not Found
  </h1>

  <p class="mt-4 text-gray-500 max-w-2xl mx-auto text-sm md:text-base">
    Oops! The page you’re looking for doesn’t exist.
  </p>

  <p class="mt-4 text-gray-400 max-w-2xl mx-auto text-sm md:text-base">
    It might have been moved, deleted, or the URL is incorrect.
  </p>

  <!-- INPUT + SELECT -->
  <div class="mt-10 max-w-2xl mx-auto flex items-center gap-2">

    <!-- URL INPUT -->
    <input
      id="url"
      type="text"
      placeholder="Go back to safety..."
      class="flex-1 min-w-0 px-4 py-2.5 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-purple-500"
    />

    <!-- DEVICE SELECT -->
    <select
      id="device"
      class="w-[120px] px-3 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-700 bg-white shrink-0"
    >
      <option value="home">Home</option>
      <option value="support">Support</option>
      <option value="blog">Blog</option>
      <option value="contact">Contact</option>
    </select>

  </div>

  <!-- BUTTON -->
  <div class="mt-3 max-w-2xl mx-auto">
    <a href="/">
      <button
        class="w-full px-5 py-3 rounded-xl bg-black text-white text-sm font-medium hover:opacity-90 transition"
      >
        Back Home
      </button>
    </a>
  </div>

  <!-- IMAGE OUTPUT (PURE IMAGES ONLY - NO CARDS, NO SHADOWS) -->
  <div class="mt-14 max-w-4xl mx-auto">

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

      <a href="/">
        <img
          src="/img/404.webp"
          class="w-full rounded-xl"
        />
      </a>

      <a href="/">
        <img
          src="/img/404 (1).webp"
          class="w-full rounded-xl"
        />
      </a>

      <a href="/">
        <img
          src="/img/404 (2).webp"
          class="w-full rounded-xl"
        />
      </a>
    </br>

    </div>

  </div>

</main>
