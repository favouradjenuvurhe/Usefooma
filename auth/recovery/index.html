<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Recover Password - Usefooma</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Recover your Plus NG account password securely.">
<meta name="theme-color" content="#f85902">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-white">

<div id="header"></div>

<div class="sticky top-0 z-50 bg-white">
    <div id="navbar"></div>
</div>

<section class="px-4 md:px-8 pt-6 md:pt-12 pb-10 bg-white">

    <div class="max-w-7xl mx-auto">

        <!-- Badge -->
        <div class="inline-flex items-center justify-center px-4 py-1.5 rounded-full border border-gray-200 bg-[#fff5ef]">

            <span class="text-[10px] md:text-xs font-semibold tracking-[0.2em] uppercase text-[#f85902]">
                Recovery
            </span>

        </div>

        <!-- Heading -->
        <div class="mt-5">

            <h2 class="font-bold tracking-tight leading-[1.05] text-[clamp(1.8rem,4.8vw,3.4rem)] text-black">
                Forgot password?
            </h2>

        </div>

        <!-- Description -->
        <div class="mt-3 max-w-xl">

            <p class="text-sm md:text-lg text-gray-500 leading-relaxed">
                Enter your email address and we'll send you a password reset link.
            </p>

        </div>

        <!-- Recovery Form -->
        <div class="mt-8 max-w-md">

            <form id="recoveryForm" class="space-y-6">

                <div>
                    <label class="block text-sm text-gray-600 mb-1">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        class="w-full bg-transparent border-b border-gray-300 focus:border-[#f85902] outline-none py-2 text-gray-900 placeholder-gray-400"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full md:w-auto px-8 py-3 rounded-full bg-[#f85902] text-white font-semibold hover:opacity-90 transition"
                >
                    Recovery password
                </button>

            </form>

        </div>

        <!-- Back to Login -->
        <div class="mt-8">

            <a
                href="/auth/login/"
                class="text-[#f85902] font-semibold hover:underline"
            >
                Back to Login
            </a>

        </div>

    </div>

</section>

<style>
h2{
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
}

@media(max-width:768px){
    h2{
        line-height:1.05;
    }
}
</style>

<script>

const sections = [
    { id: 'header', file: '/page/header.html' },
    { id: 'navbar', file: '/page/navbar.html' }
];

/* ================= TOAST ================= */

function showToast(message, type = "error") {

    const existing = document.getElementById("toast");

    if (existing) {
        existing.remove();
    }

    const toast = document.createElement("div");

    toast.id = "toast";

    toast.className =
        "fixed top-5 left-1/2 z-[99999] w-[90%] max-w-[600px] px-5 py-3 rounded-2xl text-white font-medium shadow-xl transition-all duration-300 text-center";

    toast.style.transform =
        "translateX(-50%) translateY(-20px)";

    toast.style.opacity = "0";

    toast.style.background =
        type === "success"
            ? "#16a34a"
            : "#dc2626";

    toast.innerText = message;

    document.body.appendChild(toast);

    setTimeout(() => {
        toast.style.transform =
            "translateX(-50%) translateY(0)";
        toast.style.opacity = "1";
    }, 10);

    setTimeout(() => {

        toast.style.transform =
            "translateX(-50%) translateY(-20px)";
        toast.style.opacity = "0";

        setTimeout(() => {
            toast.remove();
        }, 300);

    }, 3000);
}

/* ================= LOAD SECTIONS ================= */

sections.forEach(section => {

    fetch(section.file)
        .then(res => res.text())
        .then(html => {

            document.getElementById(section.id).innerHTML = html;

            lucide.createIcons();

            if (section.id === "navbar") {

                setTimeout(() => {

                    const mobileMenu =
                        document.getElementById("mobileMenu");

                    const openMenu =
                        document.getElementById("openMenu");

                    const closeMenu =
                        document.getElementById("closeMenu");

                    if (openMenu && mobileMenu) {
                        openMenu.addEventListener("click", () => {
                            mobileMenu.classList.add("active");
                            document.body.style.overflow = "hidden";
                        });
                    }

                    if (closeMenu && mobileMenu) {
                        closeMenu.addEventListener("click", () => {
                            mobileMenu.classList.remove("active");
                            document.body.style.overflow = "";
                        });
                    }

                }, 100);
            }

        })
        .catch(console.log);

});

/* ================= RECOVERY ================= */

const form = document.getElementById("recoveryForm");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    if (!email) {
        showToast("Please enter email address");
        return;
    }

    const btn =
        document.getElementById("submitBtn");

    const originalText =
        btn.innerHTML;

    btn.disabled = true;
    btn.innerHTML = "Sending...";

    try {

        const { recoveryAuth } =
            await import("/config/recoveryAuth.js");

        const result =
            await recoveryAuth(email);

        if (!result.success) {

            showToast(result.message);

            btn.disabled = false;
            btn.innerHTML = originalText;

            return;
        }

        showToast(
            result.message,
            "success"
        );

        form.reset();

    } catch (err) {

        showToast(
            err.message || "Recovery failed"
        );

    }

    btn.disabled = false;
    btn.innerHTML = originalText;

});

</script>

</body>
</html>
