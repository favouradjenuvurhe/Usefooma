<!-- LOAD SECTIONS -->
<script>
const sections = [
  { id: 'header', file: '/page/header.html' },
  { id: 'navbar', file: '/page/navbar.html' },
  { id: 'hero', file: '/auth/login/hero.html' },
  { id: 'section', file: '/auth/login/section.html' },
];

/* ================= TOAST ================= */
function showToast(message, type = "error") {

const existing = document.getElementById("toast");

if (existing) {
existing.remove();
}

const toast = document.createElement("div");

toast.id = "toast";

toast.className = "fixed top-5 left-1/2 z-[99999] w-[90%] max-w-[600px] px-5 py-3 rounded-2xl text-white font-medium shadow-xl transition-all duration-300 text-center";

toast.style.transform = "translateX(-50%) translateY(-20px)";
toast.style.opacity = "0";

toast.style.background =
type === "success"
? "#16a34a"
: "#dc2626";

toast.innerText = message;

document.body.appendChild(toast);

setTimeout(() => {
toast.style.transform = "translateX(-50%) translateY(0)";
toast.style.opacity = "1";
}, 10);

setTimeout(() => {

toast.style.transform =
  "translateX(-50%) translateY(-20px)";
toast.style.opacity = "0";

setTimeout(() => {
  toast.remove();
}, 300);

}, 3000);
}

sections.forEach(section => {

  fetch(section.file)
    .then(res => res.text())
    .then(html => {

      document.getElementById(section.id).innerHTML = html;

      lucide.createIcons();

      /* MOBILE MENU FIX */
      if (section.id === "navbar") {

        setTimeout(() => {

          const mobileMenu = document.getElementById("mobileMenu");
          const openMenu = document.getElementById("openMenu");
          const closeMenu = document.getElementById("closeMenu");

          if (openMenu && mobileMenu) {
            openMenu.addEventListener("click", () => {
              mobileMenu.classList.add("active");
              document.body.style.overflow = "hidden";
            });
          }

          if (closeMenu && mobileMenu) {
            closeMenu.addEventListener("click", () => {
              mobileMenu.classList.remove("active");
              document.body.style.overflow = "";
            });
          }

        }, 100);
      }

      /* LOGIN INIT */
      if (section.id === "section") {
        setTimeout(() => initLogin(), 50);
      }

    })
    .catch(err => console.log(err));

});


/* ================= LOGIN FUNCTION ================= */
function initLogin() {

  const form = document.getElementById("loginForm");

  if (!form) return;

  form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showToast("Please enter email and password");
      return;
    }

    const btn = form.querySelector("button");
    const originalText = btn.innerText;

    btn.disabled = true;
    btn.innerText = "Signing in...";

    try {

      const { loginAuth } = await import("/config/loginAuth.js");

      const result = await loginAuth({
        email,
        password
      });

      if (!result.success) {

        showToast(result.message);

        btn.disabled = false;
        btn.innerText = originalText;

        return;
      }

      showToast("Login successful", "success");

      // redirect handled inside loginAuth.js

    } catch (err) {

      showToast("Login error: " + err.message);

      btn.disabled = false;
      btn.innerText = originalText;
    }

  });

}
      </script>
