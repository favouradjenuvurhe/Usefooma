<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Get Started - Usefooma (formerly pulsepoint)</title>

<!-- Favicon -->
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/favicon.png">

<meta name="theme-color" content="#f85902">

<script src="https://cdn.tailwindcss.com"></script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-white">

<!-- SECTIONS -->
<div id="header"></div>

<div class="sticky top-0 z-50 bg-white">
  <div id="navbar"></div>
</div>

<div id="hero"></div>
<div id="section"></div>
<div id="services"></div>
<div id="footer"></div>

<!-- LOAD SECTIONS -->
    <script>
const sections = [
  { id: "header", file: "/page/header.html" },
  { id: "navbar", file: "/page/navbar.html" },
  { id: "hero", file: "/auth/get-started/hero.html" },
  { id: "section", file: "/auth/get-started/section.html" }
];

/* ================= AUTO REDIRECT IF LOGGED IN ================= */  
const existingUid = localStorage.getItem("uid");  
  
if (  
  existingUid &&  
  existingUid !== "null" &&  
  existingUid !== "undefined" &&  
  existingUid.trim() !== ""  
) {  
  window.location.replace("/dashboard");  
}  

/* ================= TOAST ================= */
function showToast(message, type = "error") {

  const existing = document.getElementById("toast");

  if (existing) {
    existing.remove();
  }

  const toast = document.createElement("div");

  toast.id = "toast";

  toast.className =
    "fixed top-5 left-1/2 z-[99999] w-[90%] max-w-[600px] px-5 py-3 rounded-2xl text-white font-medium shadow-xl transition-all duration-300 text-center";

  toast.style.transform =
    "translateX(-50%) translateY(-20px)";

  toast.style.opacity = "0";

  toast.style.background =
    type === "success"
      ? "#16a34a"
      : "#dc2626";

  toast.innerText = message;

  document.body.appendChild(toast);

  setTimeout(() => {
    toast.style.transform =
      "translateX(-50%) translateY(0)";
    toast.style.opacity = "1";
  }, 10);

  setTimeout(() => {

    toast.style.transform =
      "translateX(-50%) translateY(-20px)";

    toast.style.opacity = "0";

    setTimeout(() => {
      toast.remove();
    }, 300);

  }, 3000);
}

/* ================= LOAD SECTIONS ================= */
sections.forEach(section => {

  fetch(section.file)
    .then(res => {

      if (!res.ok) {
        throw new Error(
          `Failed to load ${section.file}`
        );
      }

      return res.text();
    })

    .then(html => {

      const container =
        document.getElementById(section.id);

      if (!container) return;

      container.innerHTML = html;

      if (window.lucide) {
        lucide.createIcons();
      }

      /* MOBILE MENU */
      if (section.id === "navbar") {

        setTimeout(() => {

          const mobileMenu =
            document.getElementById("mobileMenu");

          const openMenu =
            document.getElementById("openMenu");

          const closeMenu =
            document.getElementById("closeMenu");

          if (openMenu && mobileMenu) {
            openMenu.addEventListener(
              "click",
              () => {
                mobileMenu.classList.add("active");
                document.body.style.overflow =
                  "hidden";
              }
            );
          }

          if (closeMenu && mobileMenu) {
            closeMenu.addEventListener(
              "click",
              () => {
                mobileMenu.classList.remove(
                  "active"
                );
                document.body.style.overflow = "";
              }
            );
          }

        }, 100);
      }

      /* SIGNUP INIT */
      if (section.id === "section") {
        setTimeout(initSignup, 100);
      }

    })

    .catch(err => {
      console.error(err);
    });

});

/* ================= SIGNUP ================= */
function initSignup() {

  const form =
    document.getElementById("signupForm");

  if (!form) return;

  form.addEventListener("submit", async e => {

    e.preventDefault();

    const firstName =
      document.getElementById("firstName")
        ?.value
        .trim();

    const lastName =
      document.getElementById("lastName")
        ?.value
        .trim();

    const phone =
      document.getElementById("phone")
        ?.value
        .trim();

    const email =
      document.getElementById("email")
        ?.value
        .trim();

    const password =
      document.getElementById("password")
        ?.value;

    const confirmPassword =
      document.getElementById("confirmPassword")
        ?.value;

    const terms =
      document.getElementById("terms")
        ?.checked;

    if (
      !firstName ||
      !lastName ||
      !phone ||
      !email ||
      !password
    ) {
      showToast("Please fill all fields");
      return;
    }

    if (password !== confirmPassword) {
      showToast("Passwords do not match");
      return;
    }

    if (!terms) {
      showToast("Please accept the terms");
      return;
    }

    const btn =
      form.querySelector('button[type="submit"]');

    const originalText = btn.innerText;

    btn.disabled = true;
    btn.innerText = "Creating account...";

    try {

      const { getStarted } =
        await import("/config/getStarted.js");

      const result = await getStarted({
        firstName,
        lastName,
        phone,
        email,
        password
      });

      if (!result.success) {

        showToast(
          result.message || "Signup failed"
        );

        btn.disabled = false;
        btn.innerText = originalText;

        return;
      }

      showToast(
        "Account created successfully",
        "success"
      );

    } catch (err) {

      console.error(err);

      showToast(
        "Signup error: " + err.message
      );

      btn.disabled = false;
      btn.innerText = originalText;
    }

  });
}
    </script>
</body>
  </html>
