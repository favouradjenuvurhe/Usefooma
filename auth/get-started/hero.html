<section class="px-4 md:px-8 pt-6 md:pt-12 pb-10 bg-white">

  <div class="max-w-7xl mx-auto">

    <!-- Badge -->
    <div class="inline-flex items-center justify-center
                px-4 py-1.5 rounded-full
                border border-gray-200
                bg-[#fff5ef]">

      <span class="text-[10px] md:text-xs font-semibold tracking-[0.2em] uppercase text-[#f85902]">
        Get Started
      </span>

    </div>

    <!-- Heading -->
    <div class="mt-5">

      <h2 class="font-bold tracking-tight leading-[1.05]
                 text-[clamp(1.8rem,4.8vw,3.4rem)]
                 text-black">

        Create your account

      </h2>

    </div>

    <!-- Description -->
    <div class="mt-3 max-w-xl">

      <p class="text-sm md:text-lg text-gray-500 leading-relaxed">
        Join and start managing your plugins, analytics and more.
      </p>

    </div>

    <!-- ================= SIGNUP FORM ================= -->
    <div class="mt-8 max-w-md">

      <form class="space-y-6" id="signupForm">

        <!-- First Name -->
        <div>
          <label class="block text-sm text-gray-600 mb-1">
            First Name
          </label>

          <input
            type="text"
            id="firstName"
            placeholder="Enter your first name"
            class="w-full bg-transparent border-b border-gray-300
                   focus:border-[#f85902]
                   outline-none py-2 text-gray-900
                   placeholder-gray-400"
          />
        </div>

        <!-- Last Name -->
        <div>
          <label class="block text-sm text-gray-600 mb-1">
            Last Name
          </label>

          <input
            type="text"
            id="lastName"
            placeholder="Enter your last name"
            class="w-full bg-transparent border-b border-gray-300
                   focus:border-[#f85902]
                   outline-none py-2 text-gray-900
                   placeholder-gray-400"
          />
        </div>

        <!-- Phone -->
        <div>
          <label class="block text-sm text-gray-600 mb-1">
            Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            class="w-full bg-transparent border-b border-gray-300
                   focus:border-[#f85902]
                   outline-none py-2 text-gray-900
                   placeholder-gray-400"
          />
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm text-gray-600 mb-1">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            class="w-full bg-transparent border-b border-gray-300
                   focus:border-[#f85902]
                   outline-none py-2 text-gray-900
                   placeholder-gray-400"
          />
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm text-gray-600 mb-1">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Create a password"
            class="w-full bg-transparent border-b border-gray-300
                   focus:border-[#f85902]
                   outline-none py-2 text-gray-900
                   placeholder-gray-400"
          />
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-sm text-gray-600 mb-1">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            class="w-full bg-transparent border-b border-gray-300
                   focus:border-[#f85902]
                   outline-none py-2 text-gray-900
                   placeholder-gray-400"
          />
        </div>

        <!-- Terms -->
        <div class="flex items-start gap-3">

          <input
            type="checkbox"
            id="terms"
            class="mt-1 accent-[#f85902]"
          />

          <label
            for="terms"
            class="text-sm text-gray-600 leading-relaxed"
          >
            I agree to the
            <a href="/terms"
               class="text-[#f85902] font-medium hover:underline">
              Terms of Service
            </a>
            and
            <a href="/privacy"
               class="text-[#f85902] font-medium hover:underline">
              Privacy Policy
            </a>
          </label>

        </div>

        <!-- Button -->
        <button
          type="submit"
          class="w-full md:w-auto px-8 py-3 rounded-full
                 bg-[#f85902]
                 text-white
                 font-semibold
                 hover:opacity-90
                 transition">

          Create Account

        </button>

      </form>

    </div>

    <!-- Login Link -->
    <div class="mt-8 text-center">

      <p class="text-sm text-gray-600">

        Already have an account?

        <a
          href="/auth/login"
          class="text-[#f85902] font-semibold"
        >
          Sign in
        </a>

      </p>

    </div>

  </div>

</section>

<style>
h2{
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}

@media(max-width:768px){
  h2{
    line-height:1.05;
  }
}
  </style>
